name: Florin
description: >-
  Florin is a San Francisco fintech startup building an integrated financial
  operating system for venture-backed companies. Rather than reselling another
  bank's infrastructure, Florin is building the underlying money-movement rails
  end to end so that funds settle in real time on a single ledger the company
  owns. The product combines business accounts, cards, payments, and treasury
  management into one invite-only membership aimed at startup founders who would
  otherwise stitch together half a dozen separate tools to hold, move, and grow
  their capital. Florin was founded in 2026 by Shaurya Aggarwal (CEO), Amol Pant
  (CTO), and Aydin Sorensen, and is a member of Y Combinator's Summer 2026 batch.
  At the time of this profile Florin operates a single marketing landing page
  with a waitlist and publishes no public API, developer documentation, or other
  developer-facing surface yet; this entry captures the company's identity and
  awaits a public API to enrich further.
